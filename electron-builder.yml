# Electron Builder config — the single source of truth shared by CI (build-desktop.yml) and local builds (scripts/build-desktop.js);
# its contents match the effective config that CI injected into package.json at runtime in 0.8.4 and earlier
# (except for three intentional changes: files no longer includes node_modules,
# extraResources no longer bundles dist a second time, and publish is fixed to null).
#
# Note: electron-builder automatically collects the production
# dependency tree from the root package.json `dependencies` into the installer. `dependencies` must contain only packages the Electron main process
# actually requires at runtime (currently just undici, for the proxy ProxyAgent); all frontend dependencies go in
# devDependencies and are bundled into dist/ by vite at build time.
appId: com.github-stars-manager.app
productName: GitHub Stars Manager
copyright: Copyright © 2024 GitHub Stars Manager

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - build/**/*
  - electron/**/*
  - package.json
  - '!**/*.map'

extraMetadata:
  main: electron/main.js

compression: normal
# With asar enabled, the sources ship as an archive. All references to __dirname in electron/main.js have been verified to be
# read-only: preload.js, dist/index.html, and electron/assets/*.png are all inside the archive, and Electron
# fs shim / loadFile / nativeImage can read asar paths directly; ../build/* is a legacy fallback
# path (the files config includes build/**/*, so matching files go into the archive and behave the same with or without asar). All
# writes land in userData (proxy-config, database, logs, plugin directory) and do not depend on a writable path outside
# the asar.
asar: true

# Publishing is handled entirely by the release job (softprops/action-gh-release); the build command also passes
# --publish=never as a second guarantee that electron-builder never tries to publish on its own.
publish: null

# The target matrix matches the artifacts actually released since 0.8.4 (Setup.exe / dmg x64+arm64 / AppImage).
# win.ia32 and linux.deb/rpm in the old yml never took effect: CI always used the build field injected into
# package.json at runtime (confirmed by the `loaded configuration file=package.json` log),
# while local builds would fail on a missing package — Electron 44 no longer publishes win32-ia32 distributions; even if deb/rpm
# built successfully they would not be published (the release job only collects exe/msi/dmg/AppImage). To add a new artifact
# type, also update the Upload artifacts / Prepare release steps in build-desktop.yml.
# Windows configuration
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.png
  requestedExecutionLevel: asInvoker

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: GitHub Stars Manager

# macOS configuration
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: build/icon.png
  category: public.app-category.productivity
  gatekeeperAssess: false

dmg:
  title: GitHub Stars Manager
  icon: build/icon.png

# Linux configuration
linux:
  target: AppImage
  icon: build/icon-512x512.png
  category: Office
  synopsis: AI-powered GitHub starred repositories management tool
  description: >
    GitHub Stars Manager is an intelligent tool for organizing and managing
    your GitHub starred repositories with AI-powered analysis and release tracking.
