name: New Feature
description: Suggest a new feature or an improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a new feature for GithubStarsManager!

        Please describe your real-world use case, the limitations you face today, and how you hope the feature will help. A clear scenario makes it easier to assess priority and implementation.

  - type: textarea
    id: scenario
    attributes:
      label: Use case
      description: Describe when you need this feature and what problems or limitations you run into with the current workflow.
      placeholder: |
        For example:
        When I manage a large number of starred repositories, I want to filter projects by recent release activity so I can quickly find ones that are still maintained.
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution
      description: Describe the behavior, interaction, or implementation approach you expect.
      placeholder: |
        For example:
        Add a "Latest release date" option to the filter bar, supporting the last 7 days, 30 days, 90 days, or a custom date range.
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add reference links, screenshots, alternatives, related issues, or anything that helps explain the suggestion.
      placeholder: "For example: screenshots of related products, links to similar implementations, additional notes, etc."
    validations:
      required: false
