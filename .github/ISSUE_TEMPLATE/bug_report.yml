name: Bug Report
description: Report a reproducible bug in GithubStarsManager
title: "[Bug] "
labels: ["BUG"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve GithubStarsManager! Before submitting, please search for existing or similar issues.

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Which platform did you hit this problem on?
      options:
        - "Desktop: MacOS"
        - "Desktop: Windows"
        - "Desktop: Linux"
        - "Web"
    validations:
      required: true

  - type: dropdown
    id: backend
    attributes:
      label: Backend
      description: Which backend mode were you using when the problem occurred?
      options:
        - "No backend / frontend-only localStorage"
        - "Local backend / npm run dev:server"
        - "Docker / GHCR backend"
        - "Remote backend"
        - "Not sure"
    validations:
      required: true

  - type: textarea
    id: bug-description
    attributes:
      label: Bug description
      description: Describe what happened, what you expected to happen, and how to reproduce it.
      placeholder: |
        What happened?

        What was the expected behavior?

        Steps to reproduce:
        1.
        2.
        3.

        Frequency: every time / intermittent / only once

        App version: e.g. v0.6.2
    validations:
      required: true

  - type: textarea
    id: additional-info
    attributes:
      label: Additional information
      description: Add anything that might help pinpoint the problem, such as configuration, related issues, recent changes, browser version, or system architecture.
      placeholder: "For example: using the Docker backend with Chrome version xxx; started after updating to v0.6.2."
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste relevant logs, or drag and drop log files here. Remove sensitive information first, such as your GitHub token, AI API key, WebDAV credentials, API secret, encryption key, and proxy password.
      placeholder: "Paste logs, or drag and drop .log / .txt / .zip files here."
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag and drop screenshots here, or paste image links.
      placeholder: "Drag and drop screenshots here, or paste image links."
    validations:
      required: false

  - type: textarea
    id: video
    attributes:
      label: Video
      description: Drag and drop a screen recording here, or paste a video link.
      placeholder: "Drag and drop a screen recording here, or paste a video link."
    validations:
      required: false
