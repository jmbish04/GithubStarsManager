name: CodeQL

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LandingPage/**'
      - 'bi-site/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LandingPage/**'
      - 'bi-site/**'
  schedule:
    # Weekly full sweep on Monday ~03:37 UTC, off the top of the hour to
    # avoid GitHub's scheduled-run congestion.
    - cron: '37 3 * * 1'

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

# Heavy work runs on the Proxmox runner (guest 135, label proxmox-actions), not on
# GitHub-hosted machines. PRs from other forks fall back to GitHub so untrusted
# code never runs on the LAN-adjacent runner.
jobs:
  analyze:
    name: Analyze (javascript-typescript)
    # Pinned instead of `ubuntu-latest`: that label migrates to Ubuntu 26.04
    # between 2026-10-19 and 2026-11-19 (actions/runner-images#14748).
    runs-on: ${{ github.event.pull_request.head.repo.full_name && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || fromJSON('["self-hosted","Linux","X64","proxmox-actions"]') }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: '/language:javascript-typescript'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
