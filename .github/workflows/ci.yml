name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Heavy work runs on the Proxmox runner (guest 135, label proxmox-actions), not on
# GitHub-hosted machines. PRs from other forks fall back to GitHub so untrusted
# code never runs on the LAN-adjacent runner.
jobs:
  quality:
    name: Quality gates
    # Pinned instead of `ubuntu-latest`: that label migrates to Ubuntu 26.04
    # between 2026-10-19 and 2026-11-19 (actions/runner-images#14748), which
    # would swap the toolchain (glibc, prebuilt deps) under every gate.
    runs-on: ${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-24.04' }}
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Always full history. Do not write `&& 0 || 1`: GitHub treats 0 as
          # falsy, so that expression would force fetch-depth: 1 on PRs and
          # `git diff base...head` would fail with "invalid symmetric difference".
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Frontend layering boundaries
        run: node scripts/check-boundaries.cjs

      - name: Fetch pull request endpoints
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin \
            "${{ github.event.pull_request.base.sha }}" \
            "pull/${{ github.event.pull_request.number }}/head"

      - name: Block contributor version and update-feed edits
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # The gate skips release-file checks only for the release-please bot
          # (github-actions[bot]) whose automated PRs bump versions; every
          # human or other bot author is still blocked.
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: node scripts/check-pr-release-files.cjs --base "$PR_BASE_SHA" --head "$PR_HEAD_SHA"

      - name: Validate community plugin registry semantics
        run: node scripts/check-plugin-registry.cjs

      - name: i18n completeness and hardcoded-copy gate
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/check-i18n.cjs --base "$PR_BASE_SHA" --head "$PR_HEAD_SHA"
          else
            node scripts/check-i18n.cjs
          fi

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm run test:run

      - name: Build
        run: npm run build

      - name: Dependency audit (report-only baseline)
        # Advisory-only until the dependency backlog is cleared: currently
        # known-accepted high advisories (the braces and electron-builder
        # transitive chains, both needing major toolchain upgrades) would fail
        # this step, so the gate is report-only. Once the backlog is cleared,
        # drop `|| true` to make the audit blocking.
        run: npm audit --audit-level=high || true

  server:
    name: Server quality gates
    # Pinned instead of `ubuntu-latest`: that label migrates to Ubuntu 26.04
    # between 2026-10-19 and 2026-11-19 (actions/runner-images#14748).
    runs-on: ${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-24.04' }}
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: server

      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: server

      - name: Run tests
        run: npm test
        working-directory: server

      - name: Build
        run: npm run build
        working-directory: server

  worker:
    name: Worker typecheck
    # Pinned instead of `ubuntu-latest`: that label migrates to Ubuntu 26.04
    # between 2026-10-19 and 2026-11-19 (actions/runner-images#14748).
    runs-on: ${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-24.04' }}
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: cloudflare-worker/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: cloudflare-worker

      - name: Typecheck
        # The worker ships no test suite yet (tracked separately); keep the
        # TypeScript build honest until tests land and join this job.
        run: npx tsc --noEmit
        working-directory: cloudflare-worker

  stars-worker:
    name: github-stars-manager Worker (typecheck + tests)
    runs-on: ${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-24.04' }}
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: worker

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install -g pnpm@10.33.2 && pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Unit tests
        run: pnpm exec vitest run
